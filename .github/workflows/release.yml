name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag name to build from and upload to (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Dynamically use the release tag or the manual input tag
  RELEASE_TAG: \${{ github.event.release.tag_name || inputs.tag_name }}

jobs:
  # ── Single-file binaries (one per OS/arch) ─────────────────────────────────
  binary:
    name: binary \${{ matrix.name }}
    runs-on: \${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - name: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ env.RELEASE_TAG }}

      # mp3lame-sys builds libmp3lame from source via autotools; aws-lc-rs
      # needs cmake. C compilers are preinstalled on every runner image.
      - name: Install build prereqs (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake autoconf automake libtool pkg-config nasm

      - name: Install build prereqs (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool nasm

      # Windows: mp3lame-sys's autotools build needs MSYS2.
      - name: Install build prereqs (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make

      - name: Add MSYS2 to PATH (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/usr/bin" >> "\$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: \${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-\${{ matrix.target }}

      # Linux binaries are linked against glibc 2.17 (CentOS/RHEL 7) via
      # cargo-zigbuild so they run on older distros — a plain `cargo build` on
      # ubuntu-latest links a far newer glibc and fails on EL7 hosts. zig
      # supplies the cross-toolchain + sysroot; macOS/Windows build natively.
      - name: Set up zig (linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild (linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --bin rustyice --target \${{ matrix.target }}.2.17

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo build --release --bin rustyice --target \${{ matrix.target }}

      - name: Rename + upload binary
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          OUT="rustyice-${{ matrix.name }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/rustyice${{ matrix.ext }}" "$OUT"
          gh release upload "${{ env.RELEASE_TAG }}" "$OUT" --clobber

  # ── .deb and .rpm packages (linux amd64 + arm64) ───────────────────────────
  linux-package:
    name: package \${{ matrix.name }}
    runs-on: \${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ env.RELEASE_TAG }}

      - name: Install build prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake autoconf automake libtool pkg-config nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: \${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: package-\${{ matrix.target }}

      - name: Set up zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      # Prebuilt binaries — far faster than `cargo install`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm,cargo-zigbuild

      # Link against glibc 2.17 (CentOS/RHEL 7) so the .deb/.rpm install on
      # older distros; cargo-deb/-rpm then package this prebuilt binary
      # (--no-build / target dir is unchanged by the .2.17 glibc suffix).
      - name: Build release binary (glibc 2.17)
        run: cargo zigbuild --release --bin rustyice --target \${{ matrix.target }}.2.17 -p rustyice-server

      - name: Build .deb
        run: cargo deb -p rustyice-server --no-build --target \${{ matrix.target }}

      - name: Build .rpm
        run: cargo generate-rpm -p crates/rustyice-server --target \${{ matrix.target }}

      - name: Upload .deb and .rpm
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release upload "\({{ env.RELEASE_TAG }}" target/\){{ matrix.target }}/debian/*.deb           --clobber
          gh release upload "\({{ env.RELEASE_TAG }}" target/\){{ matrix.target }}/generate-rpm/*.rpm     --clobber
