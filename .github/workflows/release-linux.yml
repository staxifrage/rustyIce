name: Release (linux)

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "The tag name to build from and upload to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-binary:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu

          - arch: arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            autoconf \
            automake \
            libtool \
            pkg-config \
            nasm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        run: |
          cargo zigbuild \
            --release \
            --bin rustyice \
            --target ${{ matrix.target }}.2.17

      - name: Prepare binary
        shell: bash
        run: |
          cp \
            "target/${{ matrix.target }}/release/rustyice" \
            "rustyice-linux-${{ matrix.arch }}"

          chmod +x "rustyice-linux-${{ matrix.arch }}"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi

          gh release upload \
            "$RELEASE_TAG" \
            "rustyice-linux-${{ matrix.arch }}" \
            --clobber
